<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 500 500">
  <title>Metronome</title>
  <defs>
    <!-- Soft mint halo around the knob; fades to nothing at the canvas edge. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.74" stop-color="#7fe0bb" stop-opacity="0.4" />
      <stop offset="0.84" stop-color="#7fe0bb" stop-opacity="0.14" />
      <stop offset="1" stop-color="#7fe0bb" stop-opacity="0" />
    </radialGradient>
    <!-- Same stops as the BPM knob's brushed-metal face (ui/knob.ts themeMatchStops). -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7a5f" />
      <stop offset="0.18" stop-color="#7fe0bb" />
      <stop offset="0.35" stop-color="#2f7a5f" />
      <stop offset="0.52" stop-color="#4fb894" />
      <stop offset="0.7" stop-color="#7fe0bb" />
      <stop offset="0.88" stop-color="#2f7a5f" />
      <stop offset="1" stop-color="#2f7a5f" />
    </linearGradient>
    <radialGradient id="depth" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.08" />
      <stop offset="0.7" stop-color="#000" stop-opacity="0.12" />
      <stop offset="1" stop-color="#000" stop-opacity="0.4" />
    </radialGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6" />
      <stop offset="0.5" stop-color="#141416" stop-opacity="0.9" />
      <stop offset="1" stop-color="#b4b4ba" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#glow)" />
  <!-- Gear teeth: 72 notches around the rim. -->
  <circle cx="256" cy="256" r="194.5" fill="none" stroke="#8a8a90" stroke-width="11" stroke-dasharray="7.2 9.773" />
  <circle cx="256" cy="256" r="189" fill="url(#metal)" />
  <circle cx="256" cy="256" r="189" fill="url(#depth)" />
  <circle cx="256" cy="256" r="189" fill="none" stroke="url(#bezel)" stroke-width="4" />
  <path d="M256 84V116" stroke="#7fe0bb" stroke-width="9" stroke-linecap="round" />
  <!-- LCD face with the BPM readout, as the app's knob shows it. -->
  <circle cx="256" cy="256" r="107" fill="#050a07" stroke="#7fe0bb" stroke-width="5" />
  <text x="256" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="82" fill="#7fe0bb">142</text>
  <text x="256" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="4" fill="#7fe0bb" fill-opacity="0.8">BPM</text>
</svg>
